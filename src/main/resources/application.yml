spring:
  application:
    name: api.mantenimiento.vehiculos

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bd_mantenimiento_vehiculos?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update
    show-sql: false

security:
  jwt:
    key:
      private: ${SECURITY_JWT_KEY_PRIVATE}
    user:
      generator: "AUTH0JWT-BACKEND"
