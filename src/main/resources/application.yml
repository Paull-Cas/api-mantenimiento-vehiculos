spring:
  application:
    name: api.mantenimiento.vehiculos

  datasource:
    url: jdbc:mysql://localhost:3306/bd_mantenimiento_vehiculos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update
    show-sql: false

security:
  jwt:
    key:
      private: ${SECURITY_JWT_KEY_PRIVATE}
    user:
      generator: "AUTH0JWT-BACKEND"
